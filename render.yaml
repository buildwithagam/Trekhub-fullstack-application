services:
  - type: web
    name: trekhub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        value: tma-jwt-super-secret-key-9988
      - key: JWT_SECRET_KEY
        value: tma-jwt-extended-secret-key-1122
      - key: ALLOWED_ORIGINS
        value: https://trekhub-fullstack-application.vercel.app,http://localhost:8080
